services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: neurolit
      POSTGRES_PASSWORD: neurolit   # local development only; real secrets go in .env / platform secrets
      POSTGRES_DB: neurolit
    ports:
      - "5433:5432"   # 5433 on the host so it does not clash with a locally installed PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurolit -d neurolit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env                 # GROQ_API_KEY etc. Never baked into the image.
    environment:
      # inside the compose network the database is reachable as "db" on its normal port
      DATABASE_URL: postgresql://neurolit:neurolit@db:5432/neurolit
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
