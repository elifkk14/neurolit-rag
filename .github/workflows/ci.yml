name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Real PostgreSQL + pgvector, so the integration tests run here too instead of being skipped.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: neurolit
          POSTGRES_PASSWORD: neurolit
          POSTGRES_DB: neurolit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neurolit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_URL: postgresql://neurolit:neurolit@localhost:5432/neurolit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q --cov=app --cov=ingest --cov-report=term

  image:
    # Build the Docker image on every push; publish it to GHCR only from main.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
