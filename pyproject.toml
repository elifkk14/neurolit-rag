[project]
name = "neurolit-rag"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL with pgvector (docker compose up -d db)"]
